# -----------------------------------------------------------------------------
# Workflow: Standard Issue Label Router
# Triggers on issue label events and dispatches to the corresponding
# reusable workflow in EnclaveLLC/automation-workflow.
#
# Note: target workflows must declare `on: workflow_call` to be callable here.
# -----------------------------------------------------------------------------
name: Standard Workflow

on:
  workflow_call:
    inputs:
      label_name:
        required: true
        type: string
      issue_number:
        required: true
        type: number
      event_action:
        required: false
        type: string
        default: ''
    secrets:
      LINEAR_API_KEY:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SECRET_KEY:
        description: "Server-side Supabase secret key (sb_secret_...) — needed because the domains table has no anon/publishable read access (see EnclaveLLC/enclave-vsl-hub's enable_rls migration)"
        required: false

jobs:

    page-duplicate:
        name: Page Duplicate
        if: inputs.label_name == 'Page Duplicate'
        uses: ./.github/workflows/page-duplicate.yml
        with:
            issue_number: ${{ inputs.issue_number }}
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    new-page:
        if: inputs.label_name == 'New Page'
        uses: ./.github/workflows/new-page.yml
        with:
            issue_number: ${{ inputs.issue_number }}
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    page-update:
        if: inputs.label_name == 'Page Update'
        uses: ./.github/workflows/page-update.yml
        with:
            issue_number: ${{ inputs.issue_number }}
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    split-test-on:
        if: inputs.label_name == 'Split Test On'
        uses: ./.github/workflows/split-test.yml
        with:
            issue_number: ${{ inputs.issue_number }}
            type: "on"
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    split-test-off:
        if: inputs.label_name == 'Split Test Off'
        uses: ./.github/workflows/split-test.yml
        with:
            issue_number: ${{ inputs.issue_number }}
            type: "off"
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    issue-closed:
        name: Issue Closed
        if: inputs.event_action == 'closed'
        runs-on: ubuntu-latest
        permissions:
            issues: read
        env:
            GH_TOKEN: ${{ github.token }}
        outputs:
            linear_id: ${{ steps.parse.outputs.linear_id }}
            pages: ${{ steps.domain_ids.outputs.pages }}
            assignee_name: ${{ steps.assignee.outputs.assignee_name }}
            assignee_email: ${{ steps.assignee.outputs.assignee_email }}
            user_id: ${{ steps.assignee_user.outputs.user_id }}
        steps:
            - name: Checkout automation-workflow
              uses: actions/checkout@v4
              with:
                  repository: EnclaveLLC/automation-workflow
                  path: EnclaveLLC/automation-workflow
                  token: ${{ github.token }}

            - name: Parse issue body
              id: parse
              run: |
                  ISSUE_BODY=$(gh api repos/${{ github.repository }}/issues/${{ inputs.issue_number }} --jq '.body')
                  ISSUE_LABEL=$(gh issue view "${{ inputs.issue_number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[0].name // ""')
                  ISSUE_COMMENTS=$(gh api repos/${{ github.repository }}/issues/${{ inputs.issue_number }}/comments)
                  export ISSUE_BODY ISSUE_LABEL ISSUE_COMMENTS
                  node EnclaveLLC/automation-workflow/scripts/parser/issue-parser.js

            - name: Fetch Linear assignee
              id: assignee
              if: steps.parse.outputs.linear_id != ''
              env:
                  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
                  LINEAR_ID: ${{ steps.parse.outputs.linear_id }}
              run: |
                  node -e "
                  async function main() {
                    const res = await fetch('https://api.linear.app/graphql', {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Authorization': process.env.LINEAR_API_KEY,
                      },
                      body: JSON.stringify({
                        query: 'query(\$id: String!) { issue(id: \$id) { assignee { name email } } }',
                        variables: { id: process.env.LINEAR_ID },
                      }),
                    });
                    const json = await res.json();
                    if (json.errors) {
                      console.error('Linear API error:', JSON.stringify(json.errors));
                      process.exit(1);
                    }
                    const assignee = (json.data && json.data.issue && json.data.issue.assignee) || null;
                    const name = assignee ? assignee.name : '';
                    const email = assignee ? assignee.email : '';
                    console.log(\`assignee: \${name} <\${email}>\`);
                    require('fs').appendFileSync(process.env.GITHUB_OUTPUT, \`assignee_name=\${name}\nassignee_email=\${email}\n\`);
                  }
                  main().catch(err => { console.error(err); process.exit(1); });
                  "

            - name: Fetch assignee user ID
              id: assignee_user
              if: steps.assignee.outputs.assignee_email != ''
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
                  ASSIGNEE_EMAIL: ${{ steps.assignee.outputs.assignee_email }}
              run: |
                  node -e "
                  async function main() {
                    if (!process.env.SUPABASE_URL || !process.env.SUPABASE_KEY) return;

                    const email = encodeURIComponent(process.env.ASSIGNEE_EMAIL);
                    const res = await fetch(\`\${process.env.SUPABASE_URL}/rest/v1/users?email=ilike.\${email}&select=id\`, {
                      headers: {
                        apikey: process.env.SUPABASE_KEY,
                        Authorization: \`Bearer \${process.env.SUPABASE_KEY}\`,
                      },
                    });
                    if (!res.ok) {
                      console.error('Supabase users lookup failed:', res.status, await res.text());
                      process.exit(1);
                    }
                    const rows = await res.json();
                    const userId = rows.length ? rows[0].id : '';
                    console.log(\`user_id: \${userId || '(no match)'}\`);
                    require('fs').appendFileSync(process.env.GITHUB_OUTPUT, \`user_id=\${userId}\n\`);
                  }
                  main().catch(err => { console.error(err); process.exit(1); });
                  "

            - name: Restructure pages
              id: pages
              env:
                  ISSUE_TYPE: ${{ steps.parse.outputs.issue_type }}
                  PAGE_UPDATE_URLS: ${{ steps.parse.outputs.page_update_urls }}
                  SPLIT_TEST_CONTROL_URL: ${{ steps.parse.outputs.split_test_control_url }}
                  SPLIT_TEST_VARIATIONS: ${{ steps.parse.outputs.split_test_variations }}
                  NEW_PAGE_URLS: ${{ steps.parse.outputs.new_page_urls }}
                  CHECKOUT_URLS: ${{ steps.parse.outputs.checkout_urls }}
                  WISTIA_URLS: ${{ steps.parse.outputs.wistia_urls }}
              run: |
                  node -e "
                  function splitUrl(url) {
                    try {
                      const u = new URL(url);
                      const segments = u.pathname.split('/').filter(Boolean);
                      return {
                        domain: u.hostname.replace(/^www\./, ''),
                        slug: segments.length ? segments[segments.length - 1] : '',
                      };
                    } catch (e) {
                      return { domain: '', slug: '' };
                    }
                  }

                  const pages = [];
                  const newPageType = process.env.ISSUE_TYPE === 'page_duplicate' ? 'page_duplicate' : 'new_page';

                  for (const url of JSON.parse(process.env.PAGE_UPDATE_URLS || '[]')) {
                    pages.push({ type: 'page_update', ...splitUrl(url) });
                  }
                  for (const url of JSON.parse(process.env.NEW_PAGE_URLS || '[]')) {
                    pages.push({ type: newPageType, ...splitUrl(url) });
                  }
                  if (process.env.SPLIT_TEST_CONTROL_URL) {
                    pages.push({ type: 'split_test_control', ...splitUrl(process.env.SPLIT_TEST_CONTROL_URL) });
                  }
                  for (const v of JSON.parse(process.env.SPLIT_TEST_VARIATIONS || '[]')) {
                    pages.push({ type: 'split_test_variation', name: v.name, ...splitUrl(v.url) });
                  }
                  for (const c of JSON.parse(process.env.CHECKOUT_URLS || '[]')) {
                    pages.push({ type: 'checkout', pack: c.pack, ...splitUrl(c.url) });
                  }
                  for (const w of JSON.parse(process.env.WISTIA_URLS || '[]')) {
                    pages.push({ type: 'wistia', device: w.device, ...splitUrl(w.url) });
                  }

                  console.log(JSON.stringify(pages, null, 2));
                  require('fs').appendFileSync(process.env.GITHUB_OUTPUT, \`pages=\${JSON.stringify(pages)}\n\`);
                  "

            - name: Attach domain IDs
              id: domain_ids
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
                  PAGES: ${{ steps.pages.outputs.pages }}
              run: |
                  node -e "
                  async function main() {
                    const pages = JSON.parse(process.env.PAGES || '[]');
                    const domains = [...new Set(pages.map(p => p.domain).filter(Boolean))];

                    const domainIds = {};
                    if (domains.length && process.env.SUPABASE_URL && process.env.SUPABASE_KEY) {
                      const filter = domains.map(encodeURIComponent).join(',');
                      const res = await fetch(\`\${process.env.SUPABASE_URL}/rest/v1/domains?repo=in.(\${filter})&select=id,repo\`, {
                        headers: {
                          apikey: process.env.SUPABASE_KEY,
                          Authorization: \`Bearer \${process.env.SUPABASE_KEY}\`,
                        },
                      });
                      if (!res.ok) {
                        console.error('Supabase domains lookup failed:', res.status, await res.text());
                        process.exit(1);
                      }
                      for (const row of await res.json()) domainIds[row.repo] = row.id;
                    }

                    const withDomainIds = pages.map(p => ({ ...p, domain_id: domainIds[p.domain] || null }));
                    console.log(JSON.stringify(withDomainIds, null, 2));
                    require('fs').appendFileSync(process.env.GITHUB_OUTPUT, \`pages=\${JSON.stringify(withDomainIds)}\n\`);
                  }
                  main().catch(err => { console.error(err); process.exit(1); });
                  "
