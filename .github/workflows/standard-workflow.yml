# -----------------------------------------------------------------------------
# Workflow: Standard Issue Label Router
# Triggers on issue label events and dispatches to the corresponding
# reusable workflow in EnclaveLLC/automation-workflow.
#
# Note: target workflows must declare `on: workflow_call` to be callable here.
# -----------------------------------------------------------------------------
name: Standard Workflow

on:
  workflow_call:
    inputs:
      label_name:
        required: true
        type: string
      issue_number:
        required: true
        type: number
      event_action:
        required: false
        type: string
        default: ''

jobs:

    page-duplicate:
        name: Page Duplicate
        if: inputs.label_name == 'Page Duplicate'
        uses: ./.github/workflows/page-duplicate.yml
        with:
            issue_number: ${{ inputs.issue_number }}
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    new-page:
        if: inputs.label_name == 'New Page'
        uses: ./.github/workflows/new-page.yml
        with:
            issue_number: ${{ inputs.issue_number }}
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    page-update:
        if: inputs.label_name == 'Page Update'
        uses: ./.github/workflows/page-update.yml
        with:
            issue_number: ${{ inputs.issue_number }}
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    split-test-on:
        if: inputs.label_name == 'Split Test On'
        uses: ./.github/workflows/split-test.yml
        with:
            issue_number: ${{ inputs.issue_number }}
            type: "on"
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    split-test-off:
        if: inputs.label_name == 'Split Test Off'
        uses: ./.github/workflows/split-test.yml
        with:
            issue_number: ${{ inputs.issue_number }}
            type: "off"
        secrets: inherit
        permissions:
            contents: write
            issues: write
            pull-requests: write

    issue-closed:
        name: Issue Closed
        if: inputs.event_action == 'closed'
        runs-on: ubuntu-latest
        permissions:
            issues: read
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Checkout automation-workflow
              uses: actions/checkout@v4
              with:
                  repository: EnclaveLLC/automation-workflow
                  path: EnclaveLLC/automation-workflow
                  token: ${{ github.token }}

            - name: Parse issue body
              run: |
                  ISSUE_BODY=$(gh api repos/${{ github.repository }}/issues/${{ inputs.issue_number }} --jq '.body')
                  ISSUE_LABEL=$(gh issue view "${{ inputs.issue_number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[0].name // ""')
                  export ISSUE_BODY ISSUE_LABEL
                  node EnclaveLLC/automation-workflow/scripts/parser/issue-parser.js
