# -----------------------------------------------------------------------------
# Workflow: Push Deploy (Reusable)
# Triggered on direct pushes. Lean pipeline:
#   1a. FTP deploy  ─┐ parallel
#   1b. AWS deploy  ─┘
#   2.  WebOps webhook (after deploys)
# -----------------------------------------------------------------------------
name: Push Deploy

on:
  workflow_call:
    secrets:
      FTP_SERVER:
        required: false
      FTP_USERNAME:
        required: false
      FTP_PASSWORD:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      WEBOPS_WEBHOOK_SECRET:
        required: false

jobs:

  # ---------------------------------------------------------------------------
  # Job 1a: Deploy via FTP
  # ---------------------------------------------------------------------------
  deploy-ftp:
    name: FTP Deploy
    uses: ./.github/workflows/ftp-deploy.yml
    permissions:
      contents: write
      issues: write
    secrets:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  # ---------------------------------------------------------------------------
  # Job 1b: Deploy to AWS (runs in parallel with deploy-ftp)
  # ---------------------------------------------------------------------------
  deploy-aws:
    name: AWS Deploy
    uses: ./.github/workflows/aws-deploy.yml
    permissions:
      contents: write
      issues: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ---------------------------------------------------------------------------
  # Job 2: Notify enclave-webops dashboard (runs after deploys)
  # Sends a signed `push` event so the dashboard revalidates this repo.
  # Non-fatal: a webhook failure only logs a warning.
  # ---------------------------------------------------------------------------
  trigger-webhook:
    name: Trigger WebOps Webhook
    needs: [deploy-ftp, deploy-aws]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send signed push webhook
        env:
          WEBHOOK_URL:    https://enclave-webops.vercel.app/api/webhook/github
          WEBHOOK_SECRET: ${{ secrets.WEBOPS_WEBHOOK_SECRET }}
          REPO_NAME:      ${{ github.event.repository.name }}
          REPO_FULL:      ${{ github.repository }}
          REPO_OWNER:     ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::warning::WEBOPS_WEBHOOK_SECRET not set — skipping webhook"
            exit 0
          fi

          BODY=$(node -e "
            const e = process.env;
            process.stdout.write(JSON.stringify({
              ref: 'refs/heads/' + e.DEFAULT_BRANCH,
              repository: {
                name: e.REPO_NAME,
                full_name: e.REPO_FULL,
                default_branch: e.DEFAULT_BRANCH,
                owner: { login: e.REPO_OWNER },
              },
            }));
          ")
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"

          RESPONSE=$(curl -sS -w '\n%{http_code}' --max-time 30 -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: $SIG" \
            --data-binary "$BODY") || { echo "::warning::Webhook request failed"; exit 0; }

          STATUS=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP $STATUS: $(echo "$RESPONSE" | sed '$d')"
          [ "$STATUS" = "200" ] || echo "::warning::Webhook returned HTTP $STATUS"
