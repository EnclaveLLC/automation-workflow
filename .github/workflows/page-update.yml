name: Page Update

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Issue number that triggered this workflow"
        required: true
        type: number

jobs:
  # ── Job 1: Parse issue body ─────────────────────────────────────────────────
  parse-issue:
    name: Parse Issue Body
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      page_urls:       ${{ steps.parse.outputs.page_urls }}
      comment_id:      ${{ steps.progress_comment.outputs.comment_id }}
      comment_updated: ${{ steps.parse.outputs.comment_updated }}

    steps:
      - name: Comment page update in progress
        id: progress_comment
        run: |
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ inputs.issue_number }}/comments \
            -X POST \
            -f body="<img src=\"https://raw.githubusercontent.com/EnclaveLLC/automation-workflow/main/images/badges-loading.svg\" width=\"20\" height=\"20\" data-linear-height=\"20\"/> Page update in progress" \
            --jq '.id')
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout automation-workflow
        uses: actions/checkout@v4
        with:
          repository: EnclaveLLC/automation-workflow
          path: EnclaveLLC/automation-workflow
          token: ${{ github.token }}

      - name: Parse issue body
        id: parse
        env:
          COMMENT_ID: ${{ steps.progress_comment.outputs.comment_id }}
        run: |
          ISSUE_BODY=$(gh api repos/${{ github.repository }}/issues/${{ inputs.issue_number }} --jq '.body')
          export ISSUE_BODY

          # Shared parser reads every row of the "Page Update" column; its outputs go
          # to a temp file so only the page URLs (as a newline list) become step outputs.
          GITHUB_OUTPUT=/tmp/parsed.txt node EnclaveLLC/automation-workflow/scripts/parser/issue-parser.js || true
          PAGE_URLS=$(node -e "
            const fs = require('fs');
            const line = fs.existsSync('/tmp/parsed.txt')
              ? fs.readFileSync('/tmp/parsed.txt', 'utf8').split('\n').find(l => l.startsWith('page_update_urls='))
              : '';
            const urls = line ? JSON.parse(line.slice('page_update_urls='.length)) : [];
            process.stdout.write([...new Set(urls.filter(u => /^https?:\/\//.test(u)))].join('\n'));
          ")

          if [ -z "$PAGE_URLS" ]; then
            gh api repos/${{ github.repository }}/issues/comments/${COMMENT_ID} \
              -X PATCH \
              -f body="$(printf '### Page Update Failed\n\nNo URL found in the issue body.\n\nPlease follow the issue format and include a valid page URL.')"
            echo "comment_updated=true" >> "$GITHUB_OUTPUT"
            echo "ERROR: No URL found in issue body"
            exit 1
          fi

          {
            echo "page_urls<<URLS_EOF"
            echo "$PAGE_URLS"
            echo "URLS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed URLs:"
          echo "$PAGE_URLS"

  # ── Job 2: Check paths exist ────────────────────────────────────────────────
  check-path:
    name: Check Path Availability
    needs: parse-issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN:   ${{ github.token }}
      PAGE_URLS:  ${{ needs.parse-issue.outputs.page_urls }}
      COMMENT_ID: ${{ needs.parse-issue.outputs.comment_id }}
    outputs:
      comment_updated: ${{ steps.check_exists.outputs.comment_updated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Check pages exist
        id: check_exists
        run: |
          set -euo pipefail
          # URL → repo path (domain stripped, no leading slash)
          PAGE_PATHS=$(node -e "
            const urls = process.env.PAGE_URLS.split('\n').map(u => u.trim()).filter(Boolean);
            process.stdout.write(urls.map(u => new URL(u).pathname.replace(/^\/+/, '')).join('\n'));
          ")

          MISSING=""
          while IFS= read -r CLEAN_PATH; do
            DISPLAY_PATH="${CLEAN_PATH:-/ (site root)}"
            if [ ! -e "${CLEAN_PATH:-.}" ]; then
              MISSING="${MISSING}❌ ${DISPLAY_PATH}"$'\n'
              echo "ERROR: '$DISPLAY_PATH' does not exist."
            else
              echo "✅ Path '$DISPLAY_PATH' exists."
            fi
          done <<< "$PAGE_PATHS"

          if [ -n "$MISSING" ]; then
            gh api repos/${{ github.repository }}/issues/comments/${COMMENT_ID} \
              -X PATCH \
              -f body="$(printf '### Page Update Failed\n\nThe following paths do not exist in the repository:\n\n%s\nPlease check the page URLs and try again.' "$MISSING")"
            echo "comment_updated=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # ── Job 3: Post WebOps links ────────────────────────────────────────────────
  webops-link:
    name: Post WebOps Links
    needs: [parse-issue, check-path]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN:   ${{ github.token }}
      PAGE_URLS:  ${{ needs.parse-issue.outputs.page_urls }}
      COMMENT_ID: ${{ needs.parse-issue.outputs.comment_id }}

    steps:
      - name: Update comment — WebOps dashboard links
        run: |
          set -euo pipefail
          LINKS=$(node -e "
            const urls = process.env.PAGE_URLS.split('\n').map(u => u.trim()).filter(Boolean);
            const links = [...new Set(urls.map(u => {
              const url = new URL(u);
              const host = url.hostname.replace(/^www\./, '');
              const slug = url.pathname.replace(/^\/+|\/+\$/g, '').replace(/^pages\//, '');
              return '- https://enclave-webops.vercel.app/vsl/' + host + (slug ? '/' + slug : '');
            }))];
            process.stdout.write(links.join('\n'));
          ")

          gh api repos/${{ github.repository }}/issues/comments/${COMMENT_ID} \
            -X PATCH \
            -f body="$(printf '### Verification:\nReview the updated pages:\n%s' "$LINKS")"

  # ── Job: Update comment on any failure ─────────────────────────────────────
  handle-failure:
    name: Handle Failure
    needs: [parse-issue, check-path, webops-link]
    runs-on: ubuntu-latest
    if: >-
      failure() &&
      needs.parse-issue.outputs.comment_updated != 'true' &&
      needs.check-path.outputs.comment_updated != 'true'
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update comment with failure message
        env:
          COMMENT_ID: ${{ needs.parse-issue.outputs.comment_id }}
        run: |
          if [ -z "$COMMENT_ID" ]; then
            echo "No comment ID available, skipping"
            exit 0
          fi
          gh api repos/${{ github.repository }}/issues/comments/${COMMENT_ID} \
            -X PATCH \
            -f body="$(printf '### Page Update Failed\n\nAn error occurred. Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.')"
